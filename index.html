<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>松本城さんぽ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D view; sumi-ink HUD kept to the corners; shu (vermilion) reserved for the spot you are standing at */
:root{
  --sumi:#111214;
  --panel:rgba(17,18,20,.78);
  --panel-solid:#17181b;
  --ink:#eef0f1;
  --mute:#a3a8ae;
  --shu:#d2452c;
  --line:rgba(238,240,241,.15);
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sumi);color:var(--ink);overflow:hidden;font-family:var(--f-body)}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app,#app canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.place{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px);pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.6);max-width:calc(100% - 170px)}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.place .area{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.06em;margin-top:3px;text-wrap:balance}

#mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);width:108px;height:108px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0;cursor:pointer;overflow:hidden}
#mini canvas{width:100%;height:100%;display:block}
#mini .n{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--ink);text-shadow:0 0 4px #000}
#mini .tap{position:absolute;bottom:3px;right:6px;font-size:9px;color:var(--mute);letter-spacing:.1em}

.tools{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px;z-index:5}
.tool{width:60px;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tool small{font-size:10px;color:var(--mute);letter-spacing:.1em}
.tool b{font-family:var(--f-disp);font-size:16px;font-weight:800}
.tool:active{transform:scale(.96)}

#poi{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);max-width:calc(100% - 190px);display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:12px;border:1px solid rgba(210,69,44,.55);background:var(--panel);cursor:pointer;z-index:4;white-space:nowrap}
#poi .dia{width:9px;height:9px;background:var(--shu);transform:rotate(45deg);flex:none}
#poi .nm{font-family:var(--f-disp);font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis}
#poi .go{font-size:12px;color:var(--mute)}

#joy{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:1.5px solid rgba(238,240,241,.35);background:rgba(17,18,20,.25);pointer-events:none;z-index:3}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(238,240,241,.85)}

#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:var(--panel);font-size:12px;color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:4}

#card{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(430px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));max-height:min(62vh,520px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:10;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#card .kana{font-size:11px;letter-spacing:.2em;color:var(--mute)}
#card h2{font-family:var(--f-disp);font-weight:800;font-size:26px;margin:2px 0 10px;letter-spacing:.04em;text-wrap:balance}
#card p{font-size:14px;line-height:1.85;margin:0 0 14px;max-width:34em}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
#card dt{color:var(--mute);letter-spacing:.08em}
#card dd{margin:0}
#card .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;line-height:1}

#map{position:fixed;inset:0;z-index:20;background:rgba(12,13,15,.95);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px;overflow:auto;touch-action:pan-y}
#map header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#map h2{font-family:var(--f-disp);font-weight:800;font-size:22px;margin:0;letter-spacing:.06em}
#map .x{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}
.mapbody{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.mapframe{position:relative;flex:1 1 300px;max-width:min(100%,calc((100vh - 120px) * .92));aspect-ratio:460/500;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mapframe canvas{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:3px 7px 3px 5px;border-radius:7px;border:0;background:rgba(17,18,20,.82);font-size:11px;cursor:pointer;white-space:nowrap}
.pin::before{content:"";width:7px;height:7px;background:var(--shu);transform:rotate(45deg)}
.me{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(210,69,44,.8);pointer-events:none}
.spotlist{flex:1 1 240px;min-width:0;display:grid;gap:6px;align-content:start}
.spotlist button{display:flex;align-items:baseline;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(238,240,241,.03);cursor:pointer}
.spotlist b{font-family:var(--f-disp);font-size:16px;font-weight:800}
.spotlist small{color:var(--mute);font-size:11px}

#start{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:linear-gradient(180deg,rgba(10,11,13,0) 25%,rgba(10,11,13,.6) 55%,rgba(10,11,13,.93) 85%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.start-in{display:flex;gap:22px;align-items:flex-end;max-width:640px}
.vtitle{writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:800;font-size:clamp(58px,15vw,98px);line-height:1;letter-spacing:.1em;margin:0;flex:none;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.start-text{display:flex;flex-direction:column;gap:12px;min-width:0}
.start-text p{margin:0;font-size:14px;line-height:1.8;max-width:30em}
.start-text .ctl{font-size:12px;color:var(--mute);line-height:1.7}
.go-btn{align-self:flex-start;border:0;border-radius:10px;background:var(--shu);color:#fff;font-weight:700;font-size:16px;padding:14px 24px;cursor:pointer;letter-spacing:.08em}
.go-btn[disabled]{opacity:.55;cursor:default}
.note{font-size:11px;color:var(--mute)}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.8;z-index:40;background:var(--sumi)}
@media (min-width:760px){ .place .area{font-size:26px} #mini{width:132px;height:132px} }
</style>
</head>
<body>

<div id="app"></div>

<div class="place"><div class="eyebrow" id="eyebrow">松本城さんぽ · 現代</div><div class="area" id="area">本丸</div></div>
<button id="mini" aria-label="地図を開く"><canvas id="miniC"></canvas><span class="n">北</span><span class="tap">地図</span></button>

<div class="tools">
  <button class="tool" id="tView" aria-label="視点の切り替え"><small>視点</small><b id="vView">歩く</b></button>
  <button class="tool" id="tTime" aria-label="時刻の切り替え"><small>時刻</small><b id="vTime">昼</b></button>
  <button class="tool" id="tEra" aria-label="時代の切り替え"><small>時代</small><b id="vEra">現代</b></button>
  <button class="tool" id="tQual" aria-label="画質の切り替え"><small>画質</small><b id="vQual">高</b></button>
</div>

<button id="poi" hidden><span class="dia"></span><span class="nm" id="poiName"></span><span class="go">解説</span></button>
<div id="joy" hidden><i id="knob"></i></div>
<div id="hint" hidden></div>

<section id="card" hidden aria-live="polite">
  <button class="x" id="cardX" aria-label="閉じる">×</button>
  <div class="kana" id="cKana"></div>
  <h2 id="cName"></h2>
  <p id="cText"></p>
  <dl id="cMeta"></dl>
</section>

<section id="map" hidden>
  <header><h2>城と城下の地図</h2><button class="x" id="mapX">閉じる</button></header>
  <div class="mapbody">
    <div class="mapframe" id="mapFrame"><canvas id="mapC"></canvas><div class="me" id="meDot"></div></div>
    <div class="spotlist" id="spotList"></div>
  </div>
  <div class="note">ピンか一覧をタップすると、その場所へ移動します。</div>
</section>

<section id="start">
  <div class="start-in">
    <h1 class="vtitle">松本城</h1>
    <div class="start-text">
      <div class="eyebrow">国宝 · 長野県松本市 · 3D散策</div>
      <p>黒い五重の天守、朱塗りの月見櫓、白鳥の泳ぐ内堀。本丸から縄手通り、中町の蔵の通りまで歩いて巡れます。右下の「時代」で江戸時代の城下町に切り替えて歩くこともできます。</p>
      <div class="ctl" id="ctlText"></div>
      <button class="go-btn" id="goBtn" disabled>準備中…</button>
      <div class="note">建物の配置と寸法は写真資料をもとにした簡略な再現で、実測値ではありません。</div>
    </div>
  </div>
</section>

<div id="err" hidden>この端末では3D表示を開始できませんでした。<br>WebGLに対応したブラウザで開いてください。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
if(!window.THREE){ $('err').hidden=false; return; }
const isTouch=matchMedia('(pointer:coarse)').matches;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('ctlText').textContent = isTouch
  ? '画面の左半分をなぞって移動、右半分をなぞって見回します。大きく倒すと走ります。'
  : 'WASD・矢印キーで移動、ドラッグで見回し、Shiftで走ります。Mキーで地図。';

/* ---------- renderer ---------- */
let renderer;

catch(e){ $('err').hidden=false; $('start').hidden=true; return; }
let quality='high';
function applyPR(){ renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, quality==='high'?(isTouch?1.6:1.75):1)); }
applyPR();
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
$('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.25,9000);
camera.rotation.order='YXZ';
const maxAniso=renderer.capabilities.getMaxAnisotropy();

/* ---------- utils ---------- */
let seed=20261020;
function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
const pick=a=>a[(rnd()*a.length)|0];
function hash(x,y){ const h=Math.sin(x*127.1+y*311.7)*43758.5453; return h-Math.floor(h); }
function vnoise(x,y){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y,o){ let s=0,a=.5,f=1; for(let i=0;i<(o||5);i++){ s+=a*vnoise(x*f,y*f); f*=2.03; a*=.5; } return s; }
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c,srgb,repeat){ const t=new THREE.CanvasTexture(c); if(repeat!==false){ t.wrapS=t.wrapT=THREE.RepeatWrapping; } if(srgb!==false) t.encoding=THREE.sRGBEncoding; t.anisotropy=Math.min(8,maxAniso); return t; }
function speckle(g,w,h,n,a){ for(let i=0;i<n;i++){ const v=rnd()<.5?0:255; g.fillStyle=`rgba(${v},${v},${v},${(a*rnd()).toFixed(3)})`; g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2); } }
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const WHITE=new THREE.Color(1,1,1);
function TM(x,y,z,ry,sx,sy,sz,rx,rz){ const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)); return new THREE.Matrix4().compose(V3(x,y,z),q,V3(sx||1,sy||1,sz||1)); }

/* ---------- textures ---------- */
const cStone=makeCanvas(512,512);{ const g=cStone.getContext('2d'); g.fillStyle='#2a2926'; g.fillRect(0,0,512,512);

    const pts=[[3+rnd()*7,3+rnd()*7],[rw-3-rnd()*7,3+rnd()*7],[rw-3-rnd()*7,rh-3-rnd()*7],[3+rnd()*7,rh-3-rnd()*7]];
    for(const ox of [0,-512,512]){ const bx=x+ox; if(bx+rw<0||bx>512) continue;
      const gr=g.createLinearGradient(bx,y,bx+rw,y+rh); gr.addColorStop(0,`rgb(${l+20},${l+17},${l+11})`); gr.addColorStop(1,`rgb(${l-16},${l-15},${l-17})`);

const cWall=makeCanvas(256,512);{ const g=cWall.getContext('2d'); g.fillStyle='#141517'; g.fillRect(0,0,256,512);
  g.fillStyle='#e7e6e1'; g.fillRect(0,0,256,92); speckle(g,256,92,700,.12);
  g.fillStyle='#0b0b0c'; g.fillRect(0,92,256,6);
  for(let y=98;y<512;y+=18){ g.fillStyle='rgba(255,255,255,.055)'; g.fillRect(0,y,256,2); g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(0,y+15,256,3); }
  for(const x of [0,128]){ g.fillStyle='#0c0d0e'; g.fillRect(x,98,8,414); }
  g.fillStyle='#08080a'; g.fillRect(72,146,112,130); g.fillStyle='#040405'; g.fillRect(80,154,96,114);
  for(let bx=84;bx<176;bx+=11){ g.fillStyle='#4c4c49'; g.fillRect(bx,154,4,114); } }
const tWall=toTex(cWall);

const cRoof=makeCanvas(256,256);{ const g=cRoof.getContext('2d'); g.fillStyle='#3d4147'; g.fillRect(0,0,256,256);
  for(let x=0;x<256;x+=16){ const gr=g.createLinearGradient(x,0,x+16,0); gr.addColorStop(0,'rgba(0,0,0,.4)'); gr.addColorStop(.45,'rgba(255,255,255,.12)'); gr.addColorStop(1,'rgba(0,0,0,.4)'); g.fillStyle=gr; g.fillRect(x,0,16,256); }

  speckle(g,256,256,2500,.12); }
const tRoof=toTex(cRoof);

const cPlaster=makeCanvas(128,128);{ const g=cPlaster.getContext('2d'); g.fillStyle='#e9e8e3'; g.fillRect(0,0,128,128); speckle(g,128,128,900,.1); }
const tPlaster=toTex(cPlaster);

const cKura=makeCanvas(256,256);{ const g=cKura.getContext('2d'); g.fillStyle='#ebeae5'; g.fillRect(0,0,256,256); speckle(g,256,256,2200,.09);
  g.fillStyle='#121314'; g.fillRect(94,46,68,64); g.fillStyle='#3a3c3f'; g.fillRect(102,54,52,48); g.fillStyle='#121314'; g.fillRect(127,54,2,48);
  g.fillStyle='rgba(0,0,0,.08)'; g.fillRect(0,0,256,6); }
const tKura=toTex(cKura);

const cNamako=makeCanvas(256,256);{ const g=cNamako.getContext('2d'); g.fillStyle='#303337'; g.fillRect(0,0,256,256);
  g.strokeStyle='#e6e5e0'; g.lineWidth=7; g.lineCap='round';
  for(let i=-256;i<=512;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+256,256); g.stroke(); g.beginPath(); g.moveTo(i,256); g.lineTo(i+256,0); g.stroke(); } }
const tNamako=toTex(cNamako);

const cWood=makeCanvas(256,256);{ const g=cWood.getContext('2d'); g.fillStyle='#3a2a1f'; g.fillRect(0,0,256,256);
  for(let x=0;x<256;x+=8){ g.fillStyle=`rgba(${rnd()<.5?0:255},${rnd()<.5?0:200},0,${(.05+rnd()*.06).toFixed(2)})`; g.fillRect(x,0,3,256); }
  g.fillStyle='#22180f'; g.fillRect(0,0,256,18); g.fillRect(0,120,256,10);
  for(let x=6;x<256;x+=13){ g.fillStyle='#5a4330'; g.fillRect(x,136,5,120); } }
const tWood=toTex(cWood);

const cFac=makeCanvas(256,256), cFacE=makeCanvas(256,256);{ const g=cFac.getContext('2d'), e=cFacE.getContext('2d');
  g.fillStyle='#e6e3dc'; g.fillRect(0,0,256,256); speckle(g,256,256,1200,.08); e.fillStyle='#000'; e.fillRect(0,0,256,256);
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){ const x=16+c*60,y=14+r*62; const gr=g.createLinearGradient(x,y,x+44,y+38); gr.addColorStop(0,'#55636f'); gr.addColorStop(1,'#2c343c'); g.fillStyle=gr; g.fillRect(x,y,44,38); g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(x,y+38,44,4);
    const lit=rnd(); if(lit>.35){ const b=(150+rnd()*105)|0; e.fillStyle=`rgb(${b},${(b*.8)|0},${(b*.55)|0})`; e.fillRect(x,y,44,38); } } }
const tFac=toTex(cFac), tFacE=toTex(cFacE);
const cIn=makeCanvas(256,512), cInE=makeCanvas(256,512);{ const g=cIn.getContext('2d'),e=cInE.getContext('2d');
  g.fillStyle='#d6cfbf'; g.fillRect(0,0,256,512); speckle(g,256,512,1600,.08);
  g.fillStyle='#2c2219'; g.fillRect(0,250,256,262); for(let y=256;y<512;y+=22){ g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(0,y,256,2); }
  g.fillStyle='#1d1610'; g.fillRect(0,0,256,14); g.fillRect(0,242,256,12); g.fillRect(0,0,9,512); g.fillRect(247,0,9,512);

  const sp=drone?(run?30:15):(run?5.4:2.2); let l=Math.hypot(ix,iz); if(l>1){ ix/=l; iz/=l; l=1; }
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  const dx=(fx*iz+rx*ix)*sp*dt,dz=(fz*iz+rz*ix)*sp*dt;
  if(drone){ P.x=Math.max(BOUNDS.x0-60,Math.min(BOUNDS.x1+60,P.x+dx)); P.z=Math.max(BOUNDS.z0-60,Math.min(BOUNDS.z1+60,P.z+dz)); }
  else if(P.level>=0){ const L=P.level;
    if(L===0&&P.x+dx>-52.4&&P.z<46.1){ P.level=-1; P.x=-51.8; showHint('本丸に出ました'); }
    else { if(inWalk(L,P.x+dx,P.z+dz,P.x,P.z)){ P.x+=dx; P.z+=dz; } else if(inWalk(L,P.x+dx,P.z,P.x,P.z)) P.x+=dx; else if(inWalk(L,P.x,P.z+dz,P.x,P.z)) P.z+=dz;
      const st=stairAt(P.level,P.x,P.z); if(st){ if(st.dir>0&&st.t>=.96) P.level++; else if(st.dir<0&&st.t<=.04) P.level--; } } }
  else if(dx<0&&P.z>44.75&&P.z<46.25&&P.x+dx<-52.0&&P.x>-52.6){ P.level=0; P.x=-52.6; showHint('天守の中へ。奥の階段を上ると1階です'); }
  else if(walkable(P.x+dx,P.z+dz)){ P.x+=dx; P.z+=dz; } else if(walkable(P.x+dx,P.z)) P.x+=dx; else if(walkable(P.x,P.z+dz)) P.z+=dz;
  const nn=P.level>=0?.08:.25; if(camera.near!==nn){ camera.near=nn; camera.updateProjectionMatrix(); }
  const ty=drone?48:(P.level>=0?floorY(P.level,P.x,P.z):groundH(P.x,P.z))+1.6; P.y+=(ty-P.y)*Math.min(1,dt*(drone?1.6:10));
  let bob=0; if(!drone&&l>.1&&!reduceMotion){ P.bob+=dt*sp*2.1; bob=Math.sin(P.bob)*.035; }
  camera.position.set(P.x,P.y+bob,P.z); camera.rotation.set(P.pitch,P.yaw,0); }
let orbit=0;
function attract(dt){ orbit+=dt*(reduceMotion?.02:.05); const cx=-48,cz=58; camera.position.set(cx+Math.sin(orbit+.35)*125,30,cz+Math.cos(orbit+.35)*125); camera.lookAt(cx,15,cz); }

/* ---------- HUD ---------- */
let started=false,ready=false,nearSpot=null,lastArea='';
const MCOL={castle:'#1a1b1e',town:'#5b554d',house:'#8c877e',buke:'#4f4638',machi:'#5a4c3e'};
function mkMap(src,set){ const c=makeCanvas(GN,GN),x=c.getContext('2d'); x.drawImage(src,0,0); for(const b of BSETS.shared.list.concat(set.list)){ x.fillStyle=MCOL[b.kind]; x.fillRect((b.x0-DX0)*GS,(b.z0-DZ0)*GS,(b.x1-b.x0)*GS,(b.z1-b.z0)*GS); } return c; }
const mapCM=mkMap(gc,BSETS.modern),mapCE=mkMap(gcE,BSETS.edo); let mapC=mapCM; const mctx=mapCM.getContext('2d');
{ const ex=mapCE.getContext('2d'); ex.fillStyle='#5a4532'; ex.fillRect((-31-DX0)*GS,(177-DZ0)*GS,9*GS,20*GS); ex.fillRect((-27-DX0)*GS,(208.5-DZ0)*GS,14*GS,23*GS); ex.fillRect((130-DX0)*GS,(208.5-DZ0)*GS,8*GS,23*GS);
  mctx.fillStyle='#a8291c'; mctx.fillRect((-12-DX0)*GS,(69-DZ0)*GS,3.2*GS,32*GS); mctx.fillStyle='#8f8a80'; mctx.fillRect((-27-DX0)*GS,(209-DZ0)*GS,14*GS,22*GS); mctx.fillRect((129.5-DX0)*GS,(209-DZ0)*GS,9*GS,22*GS); }
const miniC=$('miniC'),mini2=miniC.getContext('2d');
function drawMini(){ const r=miniC.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1),S=Math.round(r.width*dpr); if(miniC.width!==S){ miniC.width=miniC.height=S; }
  const span=150*GS,cx=(P.x-DX0)*GS,cz=(P.z-DZ0)*GS; mini2.fillStyle='#5a5852'; mini2.fillRect(0,0,S,S); mini2.drawImage(mapC,cx-span/2,cz-span/2,span,span,0,0,S,S);
  mini2.save(); mini2.translate(S/2,S/2); mini2.rotate(-P.yaw); mini2.fillStyle='#fff'; mini2.strokeStyle='#d2452c'; mini2.lineWidth=2*dpr; mini2.beginPath(); mini2.moveTo(0,-9*dpr); mini2.lineTo(6*dpr,7*dpr); mini2.lineTo(0,3*dpr); mini2.lineTo(-6*dpr,7*dpr); mini2.closePath(); mini2.fill(); mini2.stroke(); mini2.restore(); }
const MAPR={x0:-200,x1:260,z0:-180,z1:320};
function drawMap(){ const c=$('mapC'),r=c.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1); c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const g=c.getContext('2d'); g.drawImage(mapC,(MAPR.x0-DX0)*GS,(MAPR.z0-DZ0)*GS,(MAPR.x1-MAPR.x0)*GS,(MAPR.z1-MAPR.z0)*GS,0,0,c.width,c.height);
  $('meDot').style.left=((P.x-MAPR.x0)/(MAPR.x1-MAPR.x0)*100)+'%'; $('meDot').style.top=((P.z-MAPR.z0)/(MAPR.z1-MAPR.z0)*100)+'%'; }
let curSpots=SPOTS.filter(s=>!s.edoOnly);
function spotList(){ return SPOTS.filter(s=>MODE==='edo'?!s.modernOnly:!s.edoOnly).map(s=>MODE==='edo'&&s.edo?Object.assign({},s,s.edo):s); }
function buildPins(){ const fr=$('mapFrame'),list=$('spotList'); fr.querySelectorAll('.pin').forEach(e=>e.remove()); list.innerHTML='';
  curSpots.forEach(s=>{ const b=document.createElement('button'); b.className='pin'; b.textContent=s.name; b.style.left=((s.at[0]-MAPR.x0)/(MAPR.x1-MAPR.x0)*100)+'%'; b.style.top=((s.at[1]-MAPR.z0)/(MAPR.z1-MAPR.z0)*100)+'%'; b.onclick=()=>{ teleport(s); closeMap(); }; fr.appendChild(b);
    const l=document.createElement('button'); l.innerHTML=`<b></b><small></small>`; l.querySelector('b').textContent=s.name; l.querySelector('small').textContent=s.kana; l.onclick=()=>{ teleport(s); closeMap(); openCard(s); }; list.appendChild(l); }); }
buildPins();
function toggleMap(){ $('map').hidden?openMap():closeMap(); }
function openMap(){ closeCard(); $('map').hidden=false; requestAnimationFrame(drawMap); }
function closeMap(){ $('map').hidden=true; }
function openCard(s){ $('cKana').textContent=s.kana; $('cName').textContent=s.name; $('cText').textContent=s.text; const dl=$('cMeta'); dl.innerHTML=''; s.meta.forEach(([k,v])=>{ const dt=document.createElement('dt'),dd=document.createElement('dd'); dt.textContent=k; dd.textContent=v; dl.append(dt,dd); }); $('card').hidden=false; $('poi').hidden=true; }
function closeCard(){ $('card').hidden=true; }
$('cardX').onclick=closeCard; $('mapX').onclick=closeMap; $('mini').onclick=()=>{ if(started) openMap(); };
$('poi').onclick=()=>{ if(nearSpot) openCard(nearSpot); };
$('tView').onclick=()=>{ if(!started) return; if(P.mode==='walk'){ if(P.level>=0){ P.level=-1; P.x=-46; P.z=45.5; } P.mode='drone'; $('vView').textContent='空撮'; P.pitch=Math.min(P.pitch,-.25); } else { P.mode='walk'; $('vView').textContent='歩く'; if(!walkable(P.x,P.z)){ const s=curSpots.reduce((a,b)=>Math.hypot(b.pos[0]-P.x,b.pos[1]-P.z)<Math.hypot(a.pos[0]-P.x,a.pos[1]-P.z)?b:a); P.x=s.pos[0]; P.z=s.pos[1]; } P.pitch=Math.max(P.pitch,-.2); } };
$('tTime').onclick=()=>applyTime((timeIdx+1)%TIMES.length);
function setMode(m){ MODE=m; GM.visible=m==='modern'; GE.visible=m==='edo'; mapC=m==='edo'?mapCE:mapCM; curSpots=spotList(); buildPins(); lastArea=''; nearSpot=null;
  $('vEra').textContent=m==='edo'?'江戸':'現代'; $('eyebrow').textContent='松本城さんぽ · '+(m==='edo'?'江戸後期':'現代'); applyTime(timeIdx);
  if(started&&P.level<0&&P.mode==='walk'&&!walkable(P.x,P.z)){ const s=curSpots.reduce((a,b)=>Math.hypot(b.pos[0]-P.x,b.pos[1]-P.z)<Math.hypot(a.pos[0]-P.x,a.pos[1]-P.z)?b:a); teleport(s); }
  if(started) showHint(m==='edo'?'江戸後期（1800年代前半ごろ）の松本を再現しています':'現代の松本に戻りました'); }
$('tEra').onclick=()=>setMode(MODE==='edo'?'modern':'edo');
$('tQual').onclick=()=>{ quality=quality==='high'?'low':'high'; $('vQual').textContent=quality==='high'?'高':'軽'; waterMat.uniforms.uRefl.value=quality==='high'?1:0; applyPR(); renderer.setSize(innerWidth,innerHeight); sizeRT(); setShadow(); };
function updateHUD(){ const a=P.level>=0?FL[P.level].name:areaAt(P.x,P.z); if(a!==lastArea){ lastArea=a; $('area').textContent=a; }
  let best=null,bd=1e9; for(const s of curSpots){ const d=Math.hypot(s.pos[0]-P.x,s.pos[1]-P.z); if(d<bd){ bd=d; best=s; } }
  const ns=P.level>=0?FL[P.level]:(bd<20?best:null); if(ns!==nearSpot){ nearSpot=ns; if(ns){ $('poiName').textContent=ns.name; } }
  $('poi').hidden=!nearSpot||!$('card').hidden||!$('map').hidden; }
$('goBtn').onclick=()=>{ if(!ready) return; started=true; $('start').hidden=true; teleport(curSpots[0]);
  showHint(isTouch?'左でなぞって移動 · 右でなぞって見回す':'WASDで移動 · ドラッグで見回す · Shiftで走る'); };
let hintT=0; function showHint(t){ const h=$('hint'); h.textContent=t; h.hidden=false; h.style.opacity='1'; clearTimeout(hintT); hintT=setTimeout(()=>{ h.style.opacity='0'; hintT=setTimeout(()=>h.hidden=true,700); },5000); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); sizeRT(); if(!$('map').hidden) drawMap(); });

/* ---------- loop ---------- */
applyTime(1);
let last=performance.now(),clock=0,fr=0; const _tgt=V3();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt; fr++;
  if(started) updatePlayer(dt); else attract(dt);
  for(const s of swans){ const a=clock*s.sp*6.283*.25+s.ph; const x=s.cx+Math.cos(a)*s.rx,z=s.cz+Math.sin(a)*s.rz; const tx=-Math.sin(a)*s.rx,tz=Math.cos(a)*s.rz; s.g.position.set(x,WATER_Y-.05+Math.sin(clock*1.3+s.ph)*.03,z); s.g.rotation.y=Math.atan2(tx,tz); }
  waterMat.uniforms.uTime.value=clock; sky.position.copy(camera.position);
  if(started) _tgt.set(P.x,0,P.z); else _tgt.set(-48,0,58);
  sun.position.copy(_tgt).addScaledVector(sunDir,320); sun.target.position.copy(_tgt); sun.target.updateMatrixWorld();
  renderer.shadowMap.needsUpdate=true; camera.updateMatrixWorld();
  if(quality==='high') renderReflection();
  renderer.render(scene,camera);
  if(started){ updateHUD(); if(fr%2===0) drawMini(); }
  if(!ready&&fr>2){ ready=true; const b=$('goBtn'); b.disabled=false; b.textContent='散策をはじめる'; }
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
